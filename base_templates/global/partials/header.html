<header class="main-header">
  <div class="logo-container">
    <a href="{% url 'administradora:home' %}" class="logo-text">
      🍰 Doce Delícia
    </a>
  </div>

  <nav class="main-nav">
    {% if user.is_authenticated %}
      <a href="{% url 'administradora:home' %}">Início</a>
      <a href="{% url 'categorias:listar' %}">Categorias</a>
      <a href="{% url 'produtos:listar' %}">Produtos</a>
      <a href="{% url 'kits:listar' %}">Kits</a>
      <a href="{% url 'encomendas:listar' %}">Encomendas</a>
      <a href="{% url 'administradora:usuarios_listar' %}">Usuários</a>
      <a href="{% url 'administradora:logout' %}" 
         onclick="return confirm('Tem certeza que deseja sair do sistema?');" 
         style="color: var(--color-primary);">
         Sair ({{ user.username }})
      </a>
    {% else %}
      <a href="{% url 'administradora:login' %}">Entrar</a>
    {% endif %}
  </nav>
</header>
