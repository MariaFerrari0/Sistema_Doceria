{% extends 'global/base.html' %}

{% block title %}{{ titulo }}{% endblock title %}

{% block content %}
<section class="login-wrapper" style="max-width: 600px; text-align: left;">
  <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">{{ titulo }}</h2>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <small style="color: red;">{{ field.errors.0 }}</small>
        {% endif %}
      </div>
    {% endfor %}
    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
      <button type="submit" class="btn">Salvar Produto</button>
      <a href="{% url 'produtos:listar' %}" class="btn" style="background-color: #4A3525;">Cancelar</a>
    </div>
  </form>
</section>
{% endblock content %}
